# 启用 Dependabot 版本更新时，需要指定
# 要更新的软件包生态，以及依赖清单所在位置。
# 完整配置选项请参阅文档：
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # 启用 GitHub Actions 的版本更新
  - package-ecosystem: "github-actions"
    # 在根目录查找 GitHub Actions 工作流
    directory: "/"
    # 每周检查一次更新
    schedule:
      interval: "weekly"
